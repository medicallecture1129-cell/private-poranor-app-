<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Clean Custom Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1 & 2. SEAMLESS PLAYER CONTAINER (NO BLACK BORDER FRAMING / NO PADDING VIBES) */
    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Video Canvas: Responsive 16:9 Aspect Ratio with object-fit: contain */
    .video-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: min(100vw, calc(100vh * 16 / 9));
      max-height: min(100vh, calc(100vw * 9 / 16));
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      margin: auto;
    }

    /* Pure Video Element: object-fit: contain, zero cropping, zero zoom */
    .video-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
      display: block;
      pointer-events: none;
    }

    /* Transparent Click Layer: Tapping anywhere toggles the entire control overlay */
    .touch-shield {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
      background: transparent;
    }

    /* 3. DEDICATED CENTER PLAY/PAUSE BUTTON (YOUTUBE-STYLE) */
    .center-play-wrapper {
      position: absolute;
      inset: 0;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.4, 0, 0.2, 1), transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .center-play-wrapper.is-hidden {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none !important;
    }

    .btn-center-play {
      pointer-events: auto;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .btn-center-play:hover {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.8);
      transform: scale(1.08);
    }

    .btn-center-play:active {
      transform: scale(0.94);
    }

    .btn-center-play svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .btn-center-play svg.play-icon {
      margin-left: 3px;
    }

    /* 1. TOP APP BAR */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 14px 20px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 70%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.22s cubic-bezier(0.4, 0, 0.2, 1), transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .top-bar.is-hidden {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none !important;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .app-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .app-logo img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .app-titles {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .app-name {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }

    .video-name {
      font-size: 11px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .btn-close-app {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-close-app:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-close-app svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
    }

    /* 4 & 5. CLEAN BOTTOM CONTROL BAR */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 12px 20px 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 65%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.22s cubic-bezier(0.4, 0, 0.2, 1), transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bottom-bar.is-hidden {
      opacity: 0;
      transform: translateY(100%);
      pointer-events: none !important;
    }

    /* 5. ADVANCED TIMELINE (PLAYED VS UNPLAYED DISTINCTION) */
    .timeline-container {
      position: relative;
      width: 100%;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    /* Unplayed Portion: Thin 2.5px faded translucent line */
    .timeline-track-unplayed {
      position: absolute;
      inset-x: 0;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    /* Buffered Portion: 3.5px translucent white loaded in advance */
    .timeline-track-buffered {
      position: absolute;
      left: 0;
      height: 3.5px;
      width: 0%;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 4px;
      transition: width 0.25s ease;
    }

    /* Played Portion: Bold, bright, theme-colored line (5.5px) */
    .timeline-track-played {
      position: absolute;
      left: 0;
      height: 5.5px;
      width: 0%;
      background: #2563eb;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
      transition: width 0.08s linear;
    }

    /* Scrubber Thumb - Always Visible Dot at front of played line */
    .timeline-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2563eb;
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.9), 0 2px 6px rgba(0, 0, 0, 0.6);
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.1s ease;
      pointer-events: none;
      z-index: 6;
    }

    .timeline-container:hover .timeline-thumb {
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Invisible Scrubber Range Input */
    .timeline-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    /* Controls Row (No bottom play/pause, No volume slider) */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* 6. SMART TIME DISPLAY */
    .time-display {
      font-size: 13px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      color: #e2e8f0;
      letter-spacing: 0.3px;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-ctrl svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Skip Feedback Floating Pill */
    .skip-feedback {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      padding: 10px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .skip-feedback.left {
      left: 10%;
    }

    .skip-feedback.right {
      right: 10%;
    }

    .skip-feedback.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Fullscreen / Responsive Video Player Application -->
  <div class="player-container" id="playerContainer">
    
    <!-- 1. Top App Bar: App Logo + Medical Admission Hub + Video Title + Close Button -->
    <div class="top-bar" id="topBar">
      <div class="top-bar-left">
        <div class="app-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:#3b82f6;"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="app-titles">
          <span class="app-name">Medical Admission Hub</span>
          <span class="video-name">Lec-2; Botany-08 • ইন-অ্যাপ ভিডিও প্লেয়ার</span>
        </div>
      </div>
      <button class="btn-close-app" id="btnCloseApp" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Video Canvas (Aspect Ratio Contain, Zero Dark Border Letterboxing) -->
    <div class="video-canvas" id="videoCanvas">
      
      <!-- Pure Video Content (Zero YouTube Branding, Zero Overlays) -->
      <video 
        class="video-element" 
        id="videoElement"
        playsinline 
        preload="metadata"
        src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      ></video>

      <!-- Transparent Touch/Click Layer for Single-Tap Toggle -->
      <div class="touch-shield" id="touchShield"></div>

      <!-- 3. Dedicated Center Play/Pause Button (Appears when controls are visible) -->
      <div class="center-play-wrapper" id="centerPlayWrapper">
        <button class="btn-center-play" id="btnCenterPlay" title="Play/Pause">
          <svg class="play-icon" id="centerIconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="centerIconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
      </div>

      <!-- Skip Feedback Overlays -->
      <div class="skip-feedback left" id="skipFeedbackLeft">⏪ -10s</div>
      <div class="skip-feedback right" id="skipFeedbackRight">⏩ +10s</div>

      <!-- 4 & 5. Clean Bottom Control Bar -->
      <div class="bottom-bar" id="bottomBar">
        
        <!-- 5. Advanced Timeline: 5.5px bold played vs 3.5px buffer vs 2.5px unplayed -->
        <div class="timeline-container" id="timelineContainer">
          <div class="timeline-track-unplayed"></div>
          <div class="timeline-track-buffered" id="timelineBuffered"></div>
          <div class="timeline-track-played" id="timelinePlayed"></div>
          <div class="timeline-thumb" id="timelineThumb"></div>
          <input 
            type="range" 
            min="0" 
            max="100" 
            value="0" 
            class="timeline-input" 
            id="timelineInput"
          >
        </div>

        <!-- Controls Row (No bottom play/pause, No volume slider) -->
        <div class="controls-row">
          <!-- 6. Smart Time Display: Under 60 min -> mm:ss; 60+ min -> h:mm:ss -->
          <div class="time-display" id="timeDisplay">00:00 / 00:00</div>

          <div class="controls-right">
            <!-- Playback Speed Button -->
            <button class="btn-ctrl" id="btnSpeed" title="Playback Speed">
              <span id="speedLabel">1.0x</span>
            </button>

            <!-- Fullscreen Toggle Button -->
            <button class="btn-ctrl" id="btnFullscreen" title="Fullscreen">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    // DOM Elements
    const playerContainer = document.getElementById('playerContainer');
    const topBar = document.getElementById('topBar');
    const btnCloseApp = document.getElementById('btnCloseApp');
    const video = document.getElementById('videoElement');
    const touchShield = document.getElementById('touchShield');
    const centerPlayWrapper = document.getElementById('centerPlayWrapper');
    const btnCenterPlay = document.getElementById('btnCenterPlay');
    const centerIconPlay = document.getElementById('centerIconPlay');
    const centerIconPause = document.getElementById('centerIconPause');
    const bottomBar = document.getElementById('bottomBar');
    const timelineInput = document.getElementById('timelineInput');
    const timelineBuffered = document.getElementById('timelineBuffered');
    const timelinePlayed = document.getElementById('timelinePlayed');
    const timelineThumb = document.getElementById('timelineThumb');
    const timeDisplay = document.getElementById('timeDisplay');
    const btnSpeed = document.getElementById('btnSpeed');
    const speedLabel = document.getElementById('speedLabel');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const skipFeedbackLeft = document.getElementById('skipFeedbackLeft');
    const skipFeedbackRight = document.getElementById('skipFeedbackRight');

    let controlsVisible = true;
    let autoHideTimer = null;
    let lastTapTime = 0;
    let singleTapTimeout = null;
    let showRemainingTime = false;
    const speeds = [1.0, 1.25, 1.5, 2.0];
    let currentSpeedIndex = 0;

    // Toggle Remaining / Elapsed Time on Time Display Click
    timeDisplay.addEventListener('click', (e) => {
      e.stopPropagation();
      showRemainingTime = !showRemainingTime;
      updateTimeDisplay();
    });

    if (btnCloseApp) {
      btnCloseApp.addEventListener('click', (e) => {
        e.stopPropagation();
        alert('Player closed');
      });
    }

    // 6. SMART DURATION & TIME FORMATTING RULE:
    // If total duration < 60 minutes: mm:ss (e.g. 00:00 / 45:30)
    // If total duration >= 60 minutes: h:mm:ss (e.g. 1:27:50 instead of 87:50)
    function formatSmartTime(seconds, totalDuration) {
      if (isNaN(seconds) || seconds < 0) return '00:00';
      const totalSecs = Math.floor(seconds);
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = Math.floor(totalSecs % 60);

      const pad = (n) => (n < 10 ? '0' + n : '' + n);

      // Explicitly format with hours if total video duration is 60+ minutes (>= 3600s)
      if (totalDuration >= 3600 || h > 0) {
        return `${h}:${pad(m)}:${pad(s)}`;
      }
      return `${pad(m)}:${pad(s)}`;
    }

    function updateTimeDisplay() {
      const cur = video.currentTime || 0;
      const dur = video.duration || 0;

      if (showRemainingTime) {
        const remaining = Math.max(0, dur - cur);
        timeDisplay.innerHTML = `<span style="color:#60a5fa;font-weight:700;">-${formatSmartTime(remaining, dur)}</span> <span style="color:#94a3b8;">/ ${formatSmartTime(dur, dur)}</span>`;
      } else {
        timeDisplay.innerHTML = `<span>${formatSmartTime(cur, dur)}</span> <span style="color:#94a3b8;">/ ${formatSmartTime(dur, dur)}</span>`;
      }

      if (dur > 0) {
        const percent = (cur / dur) * 100;
        timelinePlayed.style.width = `${percent}%`;
        timelineThumb.style.left = `${percent}%`;
        timelineInput.value = percent;

        // Buffer pre-loading tracker
        if (video.buffered.length > 0) {
          for (let i = 0; i < video.buffered.length; i++) {
            if (video.buffered.start(i) <= cur && cur <= video.buffered.end(i)) {
              const bufPct = (video.buffered.end(i) / dur) * 100;
              timelineBuffered.style.width = `${Math.min(100, bufPct)}%`;
              break;
            }
          }
        }
      }
    }

    // 3. SHOW / HIDE CONTROLS (YOUTUBE-STYLE TOGGLE)
    function showControls() {
      controlsVisible = true;
      if (topBar) topBar.classList.remove('is-hidden');
      centerPlayWrapper.classList.remove('is-hidden');
      bottomBar.classList.remove('is-hidden');

      if (autoHideTimer) {
        clearTimeout(autoHideTimer);
        autoHideTimer = null;
      }

      // If playing, auto-hide controls after 5 seconds of inactivity
      if (!video.paused) {
        autoHideTimer = setTimeout(() => {
          hideControls(true);
        }, 5000);
      }
    }

    function hideControls(isTimer = false) {
      // Inactivity timer will NOT auto-hide if paused, but manual screen tap CAN hide even when paused
      if (isTimer && video.paused) return;

      controlsVisible = false;
      if (topBar) topBar.classList.add('is-hidden');
      centerPlayWrapper.classList.add('is-hidden');
      bottomBar.classList.add('is-hidden');
    }

    function toggleControls() {
      if (controlsVisible) {
        hideControls(false);
      } else {
        showControls();
      }
    }

    // 3. SEAMLESS PLAY / PAUSE TOGGLE
    function togglePlay() {
      if (video.paused) {
        video.play();
        centerIconPlay.style.display = 'none';
        centerIconPause.style.display = 'inline-block';
        showControls();
      } else {
        video.pause();
        centerIconPlay.style.display = 'inline-block';
        centerIconPause.style.display = 'none';
        showControls(); // Controls remain visible permanently while paused
      }
    }

    // 3. TAPPING CENTER BUTTON TOGGLES PLAYBACK WITHOUT HIDING CONTROLS
    btnCenterPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    // 3. SINGLE-TAP TOGGLE & DOUBLE-TAP SEEK
    touchShield.addEventListener('click', (e) => {
      const rect = touchShield.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const now = Date.now();
      const timeDiff = now - lastTapTime;

      // Double-Tap detection (< 300ms)
      if (timeDiff < 300) {
        if (singleTapTimeout) {
          clearTimeout(singleTapTimeout);
          singleTapTimeout = null;
        }
        lastTapTime = 0;

        if (clickX < rect.width * 0.35) {
          // Double-tap left: Rewind 10s
          video.currentTime = Math.max(0, video.currentTime - 10);
          showSkipFeedback(skipFeedbackLeft);
        } else if (clickX > rect.width * 0.65) {
          // Double-tap right: Fast Forward 10s
          video.currentTime = Math.min(video.duration || 999999, video.currentTime + 10);
          showSkipFeedback(skipFeedbackRight);
        } else {
          togglePlay();
        }
        updateTimeDisplay();
        return;
      }

      lastTapTime = now;
      if (singleTapTimeout) clearTimeout(singleTapTimeout);

      // Single-Tap: Toggles the entire control overlay simultaneously
      singleTapTimeout = setTimeout(() => {
        singleTapTimeout = null;
        lastTapTime = 0;
        toggleControls();
      }, 240);
    });

    function showSkipFeedback(el) {
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 600);
    }

    // 5. TIMELINE SCRUBBING
    timelineInput.addEventListener('input', (e) => {
      if (video.duration) {
        const percent = Number(e.target.value);
        const newTime = (percent / 100) * video.duration;
        video.currentTime = newTime;
        updateTimeDisplay();
      }
      showControls();
    });

    video.addEventListener('timeupdate', updateTimeDisplay);
    video.addEventListener('loadedmetadata', updateTimeDisplay);
    video.addEventListener('progress', updateTimeDisplay);

    // Playback Speed Toggle
    btnSpeed.addEventListener('click', (e) => {
      e.stopPropagation();
      currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
      const newSpeed = speeds[currentSpeedIndex];
      video.playbackRate = newSpeed;
      speedLabel.textContent = `${newSpeed.toFixed(1)}x`;
      showControls();
    });

    // Fullscreen Toggle
    btnFullscreen.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        if (playerContainer.requestFullscreen) {
          playerContainer.requestFullscreen();
        } else if (playerContainer.webkitRequestFullscreen) {
          playerContainer.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'k') {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'ArrowLeft' || e.key === 'j') {
        e.preventDefault();
        video.currentTime = Math.max(0, video.currentTime - 10);
        showSkipFeedback(skipFeedbackLeft);
        updateTimeDisplay();
      } else if (e.key === 'ArrowRight' || e.key === 'l') {
        e.preventDefault();
        video.currentTime = Math.min(video.duration || 999999, video.currentTime + 10);
        showSkipFeedback(skipFeedbackRight);
        updateTimeDisplay();
      } else if (e.key === 'f') {
        e.preventDefault();
        btnFullscreen.click();
      }
    });

    // Initialize state
    updateTimeDisplay();
    showControls();
  </script>
</body>
</html>
